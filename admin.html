<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel del torneo · Ajedrez Siurot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f5a40">
<link rel="manifest" href="manifest-admin.json">
<link rel="icon" type="image/png" href="iconos/favicon.png">
<link rel="apple-touch-icon" href="iconos/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Torneo Siurot">
<link rel="stylesheet" href="estilo.css">
</head>
<body class="admin">

<header class="cab">
  <div class="cab-fila">
    <img src="iconos/icon-192.png" alt="" width="50" height="50">
    <div>
      <h1>Ajedrez Siurot</h1>
      <p>Panel del maestro</p>
    </div>
    <div class="cab-acc">
      <button class="btn-ico" id="btn-recargar" aria-label="Actualizar datos" hidden></button>
      <button class="btn-ico" data-instalar hidden aria-label="Instalar la app"></button>
    </div>
  </div>
</header>

<section id="login" class="contenido">
  <div class="panel">
    <h2>Entrar</h2>
    <p>Escribe la clave del torneo para anotar resultados y generar rondas.</p>
    <label class="etq" for="clave">Clave</label>
    <div class="clave">
      <input id="clave" class="campo" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
      <button type="button" class="btn-ico" id="ver-clave" aria-label="Mostrar la clave" aria-pressed="false"></button>
    </div>
    <label class="leyenda" style="margin-top:12px"><input type="checkbox" id="recordar"> Recordar en este dispositivo</label>
    <p class="ayuda">Márcalo solo en tu móvil u ordenador personal, no en un Chromebook compartido.</p>
    <p class="error-txt" id="login-error" role="alert"></p>
    <button class="btn" id="entrar">Entrar</button>
  </div>
</section>

<div id="app" hidden>
  <main class="contenido" id="vista" aria-live="polite"></main>
  <div class="barra-gen" id="barra" hidden></div>
  <nav class="nav" aria-label="Secciones">
    <button data-tab="mesas"></button>
    <button data-tab="clasif"></button>
    <button data-tab="jugadores"></button>
    <button data-tab="torneo"></button>
  </nav>
</div>

<div id="zona-imprimir"></div>
<input type="file" id="file-restore" accept=".json,application/json" hidden>

<script src="comun.js"></script>
<script>
(function () {
  'use strict';
  const S = Siurot;
  const { $, $$, esc, I } = S;

  let clave = '', db = null, tab = 'mesas', ronda = 0, busca = '', generando = false;
  const guardado = {};          // estado de guardado por mesa: 'guardando' | 'error'
  const cola = [];              // resultados pendientes de enviar
  let enCurso = false;
  const form = { nombre: '', clase: '', jugadores: '', rondas: '', fecha: '' };   // formulario "Nuevo torneo"
  let insc = null, inscErr = '', cargandoI = false;   // jugadores apuntados (se guardan en la hoja hasta crear el torneo)
  let aviso = null;             // texto del aviso en edición

  const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const por = () => S.jugadoresPorId(db);
  const maxRondas = S.maxRondas, sugeridas = S.rondasFide;
  const PRESETS = [
    ['directo,bh1,bh,sb,vict', 'Recomendado', 'Enfrentamiento directo → Buchholz sin el peor → Buchholz → Sonneborn-Berger → victorias'],
    ['bh,vict', 'Sencillo', 'Buchholz → victorias (como al principio)'],
    ['vict,bh1,bh,sb', 'Premia ganar', 'Victorias → Buchholz sin el peor → Buchholz → Sonneborn-Berger'],
    ['sb,bh,vict', 'Sonneborn-Berger', 'Sonneborn-Berger → Buchholz → victorias'],
    ['prog,bh1,bh,vict', 'Progresivo', 'Puntuación progresiva → Buchholz sin el peor → Buchholz → victorias']
  ];

  $('#btn-recargar').innerHTML = I.recargar;
  $('[data-instalar]').innerHTML = I.instalar;
  $('#ver-clave').innerHTML = I.ojo;
  $('#file-restore').addEventListener('change', restaurarArchivo);
  const etq = { mesas: ['Mesas', I.mesas], clasif: ['Clasificación', I.podio], jugadores: ['Jugadores', I.gente], torneo: ['Torneo', I.ajustes] };
  $$('.nav button').forEach((b) => { const e = etq[b.dataset.tab]; b.innerHTML = e[1] + '<span>' + e[0] + '</span>'; });

  // ---------- Entrada ----------
  $('#ver-clave').addEventListener('click', () => {
    const i = $('#clave'), ver = i.type === 'password';
    i.type = ver ? 'text' : 'password';
    $('#ver-clave').innerHTML = ver ? I.ojoNo : I.ojo;
    $('#ver-clave').setAttribute('aria-pressed', String(ver));
    $('#ver-clave').setAttribute('aria-label', ver ? 'Ocultar la clave' : 'Mostrar la clave');
  });
  $('#clave').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
  $('#entrar').addEventListener('click', () => entrar());

  async function entrar(silencioso, claveGuardada) {
    const k = claveGuardada || $('#clave').value;
    const err = $('#login-error'); err.textContent = '';
    if (!k) { err.textContent = 'Escribe la clave.'; return; }
    const btn = $('#entrar'); btn.disabled = true; btn.textContent = 'Comprobando…';
    try {
      await S.api.enviar({ action: 'login', key: k });
      clave = k;
      try {
        if ($('#recordar').checked) localStorage.setItem('siurot_clave', k);
        sessionStorage.setItem('siurot_clave', k);
      } catch (e) { /* sin almacenamiento */ }
      $('#clave').value = '';
      mostrarApp();
      await cargar(true);
    } catch (e) {
      if (silencioso) { try { localStorage.removeItem('siurot_clave'); sessionStorage.removeItem('siurot_clave'); } catch (x) { /* */ } }
      else err.textContent = e.message;
    } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
  }
  function mostrarApp() {
    $('#login').hidden = true; $('#app').hidden = false; $('#btn-recargar').hidden = false;
    S.nav.iniciar(tab, (t, atras) => irA(t, atras));
    pintar();
  }
  function salir() {
    try { localStorage.removeItem('siurot_clave'); sessionStorage.removeItem('siurot_clave'); } catch (e) { /* */ }
    location.reload();
  }

  // ---------- Datos ----------
  async function cargar(silencio) {
    try {
      db = await S.api.leer();
      if (!form.rondas) form.rondas = '';
      pintar();
      if (!silencio) S.toast('Datos al día', 'ok');
    } catch (e) { S.toast(e.message, 'mal'); }
  }
  function aplicar(res) { if (res && res.db) { db = res.db; } }

  // ---------- Guardado de resultados (cola, uno a uno) ----------
  function encolar(r, t, v) {
    guardado[r + '_' + t] = 'guardando';
    cola.push({ r, t, v });
    procesar();
  }
  async function procesar() {
    if (enCurso) return;
    enCurso = true;
    let fallo = false;
    while (cola.length) {
      const it = cola[0], k = it.r + '_' + it.t;
      try {
        await S.api.enviar({ action: 'setResult', key: clave, round: it.r, table: it.t, result: it.v });
        if (!cola.some((x, i) => i > 0 && x.r === it.r && x.t === it.t)) delete guardado[k];
      } catch (e) { guardado[k] = 'error'; fallo = true; S.toast(e.message, 'mal'); }
      cola.shift();
      if (tab === 'mesas') pintarMesas();
    }
    enCurso = false;
    if (!fallo) await cargar(true);
    else pintar();
  }

  // ---------- Vistas ----------
  function vacio(t, s) { return `<div class="vacio">${I.peon}<b>${t}</b>${s}</div>`; }

  function vistaMesas() {
    if (!db.started) return vacio('No hay torneo en marcha', 'Ve a la pestaña Torneo para apuntar a los jugadores y crearlo.');
    if (!ronda || ronda > db.currentRound) ronda = db.currentRound;
    const p = por();
    const ms = S.partidasRonda(db, ronda);
    const f = db.fechas[ronda] ? ` · ${S.fecha(db.fechas[ronda])}` : '';
    const antigua = ronda < db.currentRound ? `<div class="aviso"><svg viewBox="0 0 24 24"><path d="M1 21h22L12 2zm12-3h-2v-2h2zm0-4h-2v-4h2z"/></svg><div><b>Ronda anterior</b><span>Si cambias un resultado, la clasificación se recalcula, pero las mesas que ya se sortearon no cambian.</span></div></div>` : '';
    const ausentes = (db.ausentes || []).length && ronda === db.currentRound && db.roundDone ? `<p class="nota" style="margin:0 4px 10px">Ausentes en la próxima ronda: <b>${db.ausentes.map((a) => esc((p[a.id] || {}).name || '?')).join(', ')}</b></p>` : '';
    return `${antigua}${S.pasosHtml(db, ronda)}${ausentes}<p class="nota" style="margin:0 4px 12px">Toca el lado del ganador (se guarda solo). Toca otra vez para borrar. El ½ del centro es tablas. Con ⋯ marcas incomparecencias.${f ? '<br>Ronda ' + ronda + f : ''}</p>
      <div class="lista-mesas">${ms.map((m) => S.mesaHtml(m, p, { admin: true, guardado })).join('')}</div>`;
  }
  function pintarMesas() { if (tab === 'mesas' && db) { const sy = window.scrollY; $('#vista').innerHTML = vistaMesas(); window.scrollTo(0, sy); barra(); } }

  function barra() {
    const b = $('#barra');
    if (tab !== 'mesas' || !db || !db.started || ronda !== db.currentRound) { b.hidden = true; document.body.classList.add('sin-barra'); return; }
    const ms = S.partidasRonda(db, db.currentRound).filter((m) => m.player2Id > 0);
    const hechos = ms.filter((m) => m.result).length, pend = ms.length - hechos;
    const guardando = cola.length > 0 || enCurso;
    let boton;
    if (generando) boton = '<button class="btn" disabled>Generando…</button>';
    else if (db.currentRound >= db.totalRondas && pend === 0) boton = `<button class="btn cinta" data-act="fin">${I.corona} Torneo terminado: ver clasificación</button>`;
    else if (pend > 0) boton = `<button class="btn" disabled>Faltan ${pend} resultado${pend === 1 ? '' : 's'}</button>`;
    else if (guardando) boton = '<button class="btn" disabled>Guardando…</button>';
    else boton = `<button class="btn cinta" data-act="generar">Generar ronda ${db.currentRound + 1} de ${db.totalRondas}</button>`;
    b.innerHTML = `<div><p>Ronda ${db.currentRound}: ${hechos} de ${ms.length} resultados</p><div class="progreso"><i style="width:${ms.length ? Math.round(hechos * 100 / ms.length) : 0}%"></i></div>${boton}</div>`;
    b.hidden = false; document.body.classList.remove('sin-barra');
  }

  let clasifModo = 'general';
  function vistaClasif() {
    if (!db.started) return vacio('Todavía no hay clasificación', 'Crea un torneo para empezar.');
    const seg = [['general', 'General'], ['curso', 'Por curso'], ['clase', 'Por clase'], ['cruzado', 'Cuadro']];
    let h = `<div class="seg" role="group">${seg.map((x) => `<button data-seg="${x[0]}" aria-pressed="${clasifModo === x[0]}">${x[1]}</button>`).join('')}</div>`;
    if (clasifModo === 'general') h += S.clasificacionHtml(db, {}) + S.notaDesempate(db);
    else if (clasifModo === 'cruzado') h += S.cruzadoHtml(db);
    else h += S.categoriasHtml(db, clasifModo, {});
    return h + `<div class="btns"><button class="btn sec" data-act="imprimir-clasif">${I.imprimir} Imprimir la clasificación</button></div>`;
  }

  function vistaJugadores() {
    if (!db.players.length) return vacio('No hay jugadores', 'Crea un torneo desde la pestaña Torneo.');
    const q = norm(busca.trim());
    let lista = db.players.slice().sort((a, b) => a.name.localeCompare(b.name, 'es'));
    if (q) lista = lista.filter((x) => norm(x.name).includes(q));
    let h = `<div class="buscar">${I.lupa}<label class="sr" for="q">Buscar jugador</label><input id="q" type="search" placeholder="Buscar jugador" value="${esc(busca)}" autocomplete="off"></div>`;
    const aus0 = {}; (db.ausentes || []).forEach((a) => { aus0[a.id] = a.tipo; });
    lista.forEach((x) => { h += `<button class="fila-j ${x.retired ? 'ret' : ''}" data-act="jugador" data-id="${x.id}"><span class="pos num">${x.pos}</span><span class="n">${esc(x.name)}${x.retired ? '<small>retirado</small>' : aus0[x.id] ? '<small>ausente en la próxima ronda' + (aus0[x.id] === 'medio' ? ' (+½)' : '') + '</small>' : ''}</span><span class="p num">${S.pts(x.points)}</span></button>`; });
    return `<div class="btns" style="margin:0 0 14px"><button class="btn cinta" data-act="alta">${I.mas} Añadir un jugador nuevo</button></div>` + h + '<p class="nota">Toca un jugador para ver sus partidas, marcarlo ausente, o retirarlo del torneo (por ejemplo, si se marcha del colegio).</p>';
  }

  async function cargarInsc() {
    cargandoI = true; inscErr = '';
    try { const r = await S.api.enviar({ action: 'getInscritos', key: clave }); insc = r.inscritos || []; }
    catch (e) { inscErr = e.message; }
    cargandoI = false;
    if (tab === 'torneo') pintar();
  }
  function inscripcionHtml(hay) {
    if (insc === null) {
      if (!cargandoI && !inscErr) cargarInsc();
      return `<section class="panel"><h2>Jugadores apuntados</h2>${inscErr ? `<p class="ayuda">No se pudo cargar la lista: ${esc(inscErr)}</p><div class="btns"><button class="btn sec" data-act="reintentar-insc">Reintentar</button></div>` : '<p class="ayuda">Cargando la lista…</p>'}</section>`;
    }
    const grupos = {};
    insc.forEach((n) => { const c = S.curso(n); const k = c ? c.clase : 'Sin clase'; (grupos[k] = grupos[k] || []).push(n); });
    const claves = Object.keys(grupos).sort((x, y) => x === 'Sin clase' ? 1 : y === 'Sin clase' ? -1 : x.localeCompare(y, 'es', { numeric: true }));
    const lista = claves.length
      ? claves.map((k) => `<h3 class="cat-insc">${esc(k)} <span class="num">· ${grupos[k].length}</span></h3><ul class="lista-insc">${grupos[k].map((n) => `<li><span>${esc(n)}</span><button class="quitar" data-act="quitar-insc" data-n="${esc(n)}" aria-label="Quitar a ${esc(n)}">×</button></li>`).join('')}</ul>`).join('')
      : '<p class="ayuda">Todavía no hay nadie apuntado.</p>';
    return `<section class="panel"><h2>${hay ? 'Apuntar para el próximo torneo' : 'Apuntar jugadores'}</h2>
      <p class="ayuda" style="margin:0 0 6px">Ve clase por clase. La lista se guarda en tu hoja y no empieza nada hasta que pulses «Crear torneo».</p>
      <label class="etq" for="f-clase">Clase (opcional; se añade a cada nombre)</label><input id="f-clase" class="campo" maxlength="12" placeholder="4ºA" value="${esc(form.clase)}">
      <label class="etq" for="f-jug">Quién juega (uno por línea)</label>
      <textarea id="f-jug" class="campo" style="min-height:130px" placeholder="Ana&#10;Luis&#10;Marta">${esc(form.jugadores)}</textarea>
      <div class="btns"><button class="btn" data-act="apuntar">Apuntar a la lista</button></div></section>
      <section class="panel"><h2>Apuntados · <span class="num">${insc.length}</span></h2>${lista}
      ${insc.length ? '<div class="btns"><button class="btn sec" data-act="vaciar-insc">Vaciar la lista</button></div>' : ''}</section>`;
  }
  let histAdmin = null, cargandoH = false;
  async function cargarHistAdmin() {
    cargandoH = true;
    try { histAdmin = await S.api.historial(); } catch (e) { histAdmin = []; }
    cargandoH = false;
    if (tab === 'torneo') pintar();
  }
  function selRondas(n) {
    if (n < 4) return '<option value="">Escribe al menos 4 jugadores</option>';
    return ['<option value="">Recomendado (FIDE): ' + sugeridas(n) + ' rondas</option>'].concat(S.opcionesRondas(n).map((o) => `<option value="${o.r}" ${String(o.r) === form.rondas ? 'selected' : ''}>${o.r} rondas · ${o.txt}</option>`)).join('');
  }

  function vistaTorneo() {
    const hay = db && db.started;
    const n = db ? db.players.length : 0;
    let h = '';
    if (hay) {
      h += `<section class="panel"><h2>Días de juego</h2><p class="ayuda" style="margin:0 0 6px">Las familias ven la fecha de cada ronda y el aviso de «próxima ronda».</p>`;
      for (let r = 1; r <= db.totalRondas; r++) h += `<div class="fila-ronda"><b>Ronda ${r}</b><input class="campo" type="date" data-fecha="${r}" value="${esc(db.fechas[r] || '')}" aria-label="Fecha de la ronda ${r}"></div>`;
      h += '</section>';
      const max = maxRondas(n), min = Math.max(db.currentRound, 1);
      h += `<section class="panel"><h2>Número de rondas</h2>
        <p class="ayuda" style="margin:0 0 4px">Con ${n} jugadores, la FIDE recomienda al menos <b>${sugeridas(n)} rondas</b> (⌈log₂ ${n}⌉): es lo mínimo para que pueda haber un único ganador con todos los puntos. Con más rondas la clasificación es más fiable, pero hacen falta más días de recreo.</p>
        <div class="opciones">${S.opcionesRondas(n).map((o) => `<button class="opcion" data-act="rondas" data-r="${o.r}" aria-pressed="${db.totalRondas === o.r}" ${o.r < min ? 'disabled' : ''}><b>${o.r}</b><span>${o.txt}<small>${o.r} recreos</small></span></button>`).join('')}</div>
        <div class="paso-num"><button data-act="menos" ${db.totalRondas <= min ? 'disabled' : ''} aria-label="Una ronda menos">−</button><b class="num">${db.totalRondas}</b><button data-act="mas" ${db.totalRondas >= max ? 'disabled' : ''} aria-label="Una ronda más">+</button></div>
        <p class="ayuda" style="text-align:center">Permitido: de ${min} a ${max} rondas.</p></section>`;
      const act = (db.desempates || []).join(',');
      h += `<section class="panel"><h2>Desempates</h2><p class="ayuda" style="margin:0 0 4px">Si dos jugadores tienen los mismos puntos, se decide por este orden.</p>
        <div class="opciones">${PRESETS.map((x) => `<button class="opcion" data-act="desemp" data-l="${x[0]}" aria-pressed="${act === x[0]}"><span>${x[1]}<small>${x[2]}</small></span></button>`).join('')}</div></section>`;
      if (aviso === null) aviso = db.aviso || '';
      h += `<section class="panel"><h2>Aviso para las familias</h2><label class="etq" for="aviso">Mensaje (aparece arriba en la web)</label>
        <textarea id="aviso" class="campo" maxlength="300" placeholder="Ej.: Mañana jugamos la ronda 3 en el patio, a la hora del recreo.">${esc(aviso)}</textarea>
        <div class="btns"><button class="btn" data-act="guardar-aviso">Guardar aviso</button></div></section>`;
      h += `<section class="panel"><h2>Imprimir y guardar</h2><p class="ayuda" style="margin:0 0 6px">Imprimir abre el cuadro de Chrome; también puedes elegir «Guardar como PDF».</p>
        <div class="btns"><button class="btn sec" data-act="imprimir-mesas">${I.imprimir} Mesas de la ronda ${ronda || db.currentRound}</button><button class="btn sec" data-act="imprimir-clasif">${I.imprimir} Clasificación</button>
        <button class="btn sec" data-act="excel">${I.descarga} Descargar para Excel (.csv)</button>
        <button class="btn sec" data-act="copia">${I.descarga} Guardar copia de seguridad</button>
        <button class="btn sec" data-act="restaurar">${I.subir} Restaurar una copia…</button></div></section>`;
      if (histAdmin === null && !cargandoH) cargarHistAdmin();
      h += `<section class="panel"><h2>Torneos anteriores</h2>${histAdmin === null ? '<p class="ayuda">Cargando…</p>' : histAdmin.length ? `<ul class="lista-hist">${histAdmin.map((x) => `<li><a href="index.html?archivo=${x.n}">${I.corona}<span><b>${esc(x.nombre)}</b><small>${esc(x.fecha)} · ${esc(x.jugadores)} jugadores · ${esc(x.campeon)}</small></span></a></li>`).join('')}</ul>` : '<p class="ayuda">Aún no hay ninguno.</p>'}
        <p class="ayuda">Al crear un torneo nuevo, el anterior se guarda solo aquí (los 30 últimos).</p></section>`;
      if (db.currentRound > 1) h += `<section class="panel"><h2>Me he equivocado</h2><p>Si generaste una ronda por error, puedes deshacer la última (la ronda ${db.currentRound}) y sus resultados. Para corregir un resultado de una ronda anterior, ve a Mesas, elige esa ronda y cámbialo.</p><div class="btns"><button class="btn sec" data-act="deshacer">Deshacer la ronda ${db.currentRound}</button></div></section>`;
      else h += `<section class="panel"><h2>¿Faltan jugadores por apuntar?</h2><p>Estás en la ronda 1. Puedes volver a la inscripción: las mesas de la ronda 1 se borran, los ${db.players.filter((x) => !x.retired).length} jugadores pasan a la lista de apuntados y puedes seguir añadiendo clases. El sorteo se hace de nuevo cuando pulses «Crear torneo».</p><div class="btns"><button class="btn sec" data-act="reabrir-insc">Volver a la inscripción</button></div></section>`;
    }
    const lineas = insc ? insc.length : 0;
    h += inscripcionHtml(hay);
    h += `<section class="panel"><h2>${hay ? 'Empezar un torneo nuevo' : 'Crear el torneo'}</h2>
      ${hay ? '<p class="ayuda" style="margin:0 0 6px">El torneo actual se guarda en «Torneos anteriores» antes de empezar el nuevo.</p>' : ''}
      <label class="etq" for="f-nombre">Nombre del torneo</label><input id="f-nombre" class="campo" maxlength="60" placeholder="Torneo de ajedrez del recreo" value="${esc(form.nombre)}">
      <p class="ayuda" id="f-cuenta">${lineas} jugador${lineas === 1 ? '' : 'es'} apuntado${lineas === 1 ? '' : 's'}${lineas >= 4 ? ' · rondas recomendadas (FIDE): ' + sugeridas(lineas) : ' · hacen falta al menos 4'}.</p>
      <label class="etq" for="f-rondas">Número de rondas</label><select id="f-rondas" class="campo">${selRondas(lineas)}</select>
      <label class="etq" for="f-fecha">Día de la ronda 1 (opcional)</label><input id="f-fecha" class="campo" type="date" value="${esc(form.fecha)}">
      <div class="btns"><button class="btn cinta" data-act="crear">${hay ? 'Guardar el anterior y crear el torneo nuevo' : 'Crear torneo y sortear la ronda 1'}</button></div></section>`;
    h += `<section class="panel"><h2>Sesión</h2><div class="btns"><button class="btn sec" data-act="salir">Cerrar sesión</button></div>
      <p class="ayuda"><a class="enlace" href="?diag">Comprobar que la app está bien instalada</a></p>
      <button class="btn" data-instalar hidden style="margin-top:8px">${I.instalar} Instalar el panel en este dispositivo</button>
      <p data-ios hidden class="ayuda">En iPhone: botón Compartir de Safari → <b>Añadir a pantalla de inicio</b>.</p></section>`;
    return h;
  }

  function pintar() {
    if (!db) return;
    $$('.nav button').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
    const foco = document.activeElement && document.activeElement.id === 'q';
    const pos = foco ? document.activeElement.selectionStart : 0;
    $('#vista').innerHTML = ({ mesas: vistaMesas, clasif: vistaClasif, jugadores: vistaJugadores, torneo: vistaTorneo })[tab]();
    S.pintarInstalar(); barra();
    if (foco) { const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
  }
  function irA(t, atras) {
    if (t === tab) return;
    tab = t; busca = '';
    if (!atras) S.nav.pestana(t);
    pintar(); window.scrollTo(0, 0);
  }

  // ---------- Acciones ----------
  function fichaJugador(id) {
    const x = por()[id]; if (!x) return;
    const quedan = db.started && db.currentRound < db.totalRondas && !x.retired;
    const actual = ((db.ausentes || []).find((a) => a.id === id) || {}).tipo || '';
    const opc = (v, t, sub) => `<button class="opcion" data-r="aus:${v}" aria-pressed="${actual === v}"><span>${t}<small>${sub}</small></span></button>`;
    const aus = quedan ? `<h3 style="margin:6px 0 0;font-size:1.05rem">Próxima ronda (la ${db.currentRound + 1})</h3><div class="opciones" style="margin:6px 0 12px">${opc('', 'Juega', 'Se le empareja con normalidad')}${opc('cero', 'Ausente · 0 puntos', 'No juega esa ronda')}${opc('medio', 'Ausente · ½ punto', 'Falta justificada (permiso, excursión…)')}</div>` : '';
    const caja = S.hoja(S.fichaHtml(db, x, `${aus}<p class="ayuda">${x.retired ? 'Está retirado: no se le empareja en las próximas rondas.' : 'Si se retira, no se le emparejará más; sus puntos y partidas se conservan.'}</p>
      <div class="btns"><button class="btn ${x.retired ? '' : 'mal'}" data-r="ret">${x.retired ? 'Reincorporar al torneo' : 'Retirar del torneo'}</button><button class="btn sec" data-r="x">Cerrar</button></div>`));
    caja.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-r]'); if (!b) return;
      const r = b.dataset.r;
      if (r.indexOf('aus:') === 0) {
        if (await enviar({ action: 'setAusente', id, value: r.slice(4) }, r.slice(4) ? 'Marcado como ausente en la próxima ronda' : 'Jugará la próxima ronda')) { pintar(); S.cerrarHoja(); }
        return;
      }
      if (r !== 'ret') { S.cerrarHoja(); return; }
      if (!x.retired) {
        const ok = await S.confirmar({ titulo: `¿Retirar a ${x.name}?`, texto: 'No se le emparejará en las próximas rondas.', ok: 'Retirar', peligro: true });
        if (!ok) return;
      }
      try { aplicar(await S.api.enviar({ action: 'setRetirado', key: clave, id, value: !x.retired })); pintar(); S.toast(x.retired ? 'Reincorporado' : 'Retirado', 'ok'); S.cerrarHoja(); }
      catch (err) { S.toast(err.message, 'mal'); }
    });
  }

  function fijarResultado(r, t, v) {
    const m = db.matches.find((x) => x.round === r && x.table === t); if (!m) return;
    m.result = v; encolar(r, t, v); pintarMesas();
  }
  function opcionesMesa(r, t) {
    const m = db.matches.find((x) => x.round === r && x.table === t), p = por(); if (!m || m.player2Id <= 0) return;
    const b = p[m.player1Id].name, n = p[m.player2Id].name;
    const o = (v, ttl, sub) => `<button class="opcion" data-v="${v}" aria-pressed="${m.result === v}"><span>${ttl}<small>${sub}</small></span></button>`;
    const caja = S.hoja(`<div class="asa"></div><h2>Mesa ${t} · ronda ${r}</h2><p class="sub">${esc(b)} (blancas) contra ${esc(n)} (negras)</p>
      <div class="opciones">${o('1-0', 'Gana ' + esc(b), 'Partida jugada')}${o('0-1', 'Gana ' + esc(n), 'Partida jugada')}${o('1/2-1/2', 'Tablas', '½ punto para cada uno')}
      ${o('1-0F', 'No se presenta ' + esc(n), 'Gana ' + esc(b) + ' por incomparecencia')}${o('0-1F', 'No se presenta ' + esc(b), 'Gana ' + esc(n) + ' por incomparecencia')}${o('0-0F', 'No se presenta ninguno', '0 puntos para los dos')}
      ${m.result ? o('', 'Borrar el resultado', 'Vuelve a estar por jugar') : ''}</div>
      <div class="btns"><button class="btn sec" data-x="1">Cerrar</button></div>`);
    caja.addEventListener('click', (e) => {
      const q = e.target.closest('[data-v],[data-x]'); if (!q) return;
      if (q.dataset.v !== undefined) fijarResultado(r, t, q.dataset.v);
      S.cerrarHoja();
    });
  }

  function dialogoAlta() {
    const aviso1 = db.currentRound === 1 ? '<p class="ayuda" style="margin:0 0 8px">Estás en la ronda 1. Si todavía no ha empezado nadie a jugar y faltan clases por apuntar, es mejor <b>Volver a la inscripción</b> (pestaña Torneo): así entran en el sorteo de la ronda 1.</p>' : '';
    const caja = S.hoja(`<div class="asa"></div><h2>Añadir jugadores</h2><p class="sub">Entran en el torneo a partir de la próxima ronda.</p>${aviso1}
      <label class="etq" for="al-c">Clase (opcional; se añade a cada nombre)</label><input id="al-c" class="campo" maxlength="12" placeholder="4ºA" autocomplete="off">
      <label class="etq" for="al-n">Nombres (uno por línea)</label><textarea id="al-n" class="campo" style="min-height:120px" placeholder="Ana&#10;Luis&#10;Marta"></textarea>
      <label class="etq" for="al-p">Por las rondas que ya se han jugado</label>
      <select id="al-p" class="campo"><option value="0">Suman 0 puntos</option><option value="0.5">Suman ½ punto por ronda</option></select>
      <p class="error-txt" id="al-e"></p>
      <div class="btns dos"><button class="btn sec" data-r="no">Cancelar</button><button class="btn cinta" data-r="si">Añadir</button></div>`);
    caja.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-r]'); if (!b) return;
      if (b.dataset.r !== 'si') { S.cerrarHoja(); return; }
      const cl = $('#al-c', caja).value.replace(/\s+/g, '').trim();
      const nombres = $('#al-n', caja).value.split('\n').map((x) => x.replace(/\s+/g, ' ').trim()).filter(Boolean).map((x) => (cl && !S.curso(x) ? x + ' ' + cl : x));
      if (!nombres.length) { $('#al-e', caja).textContent = 'Escribe al menos un nombre.'; return; }
      try {
        aplicar(await S.api.enviar({ action: 'addPlayers', key: clave, nombres, puntos: parseFloat($('#al-p', caja).value) }));
        S.cerrarHoja(); pintar(); S.toast(nombres.length === 1 ? nombres[0] + ' añadido' : nombres.length + ' jugadores añadidos', 'ok');
      } catch (err) { $('#al-e', caja).textContent = err.message; }
    });
  }

  async function restaurarArchivo(ev) {
    const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
    if (!f) return;
    try {
      const datos = JSON.parse(await f.text());
      const res = await S.api.enviar({ action: 'restore', key: clave, datos });
      aplicar(res); aviso = null; histAdmin = null; ronda = db.currentRound; pintar();
      S.toast('Copia restaurada', 'ok');
    } catch (err) { S.toast(err instanceof SyntaxError ? 'Ese archivo no es una copia válida' : err.message, 'mal'); }
  }

  function dialogoGenerar() {
    if (cola.length || enCurso) { S.toast('Espera a que termine de guardar', 'mal'); return; }
    const n = db.currentRound + 1;
    const caja = S.hoja(`<div class="asa"></div><h2>Generar la ronda ${n}</h2>
      <p class="sub">Se emparejará según la clasificación actual, sin repetir rivales y repartiendo los colores.</p>
      <label class="etq" for="f-f">Día de juego (opcional)</label><input id="f-f" type="date" class="campo" value="${esc(db.fechas[n] || '')}">
      <div class="btns dos"><button class="btn sec" data-r="no">Cancelar</button><button class="btn cinta" data-r="si">Generar</button></div>`);
    caja.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-r]'); if (!b) return;
      const fecha = $('#f-f', caja).value;
      S.cerrarHoja();
      if (b.dataset.r !== 'si') return;
      generando = true; barra();
      try {
        const res = await S.api.enviar({ action: 'nextRound', key: clave, fecha });
        aplicar(res); ronda = db.currentRound;
        S.toast(`Ronda ${db.currentRound} generada`, 'ok');
        if (res.warnings && res.warnings.length) S.aviso('Revisa estas mesas', '<ul>' + res.warnings.map((w) => `<li>${esc(w)}</li>`).join('') + '</ul>');
      } catch (err) { S.toast(err.message, 'mal'); }
      generando = false; pintar(); window.scrollTo(0, 0);
    });
  }

  async function crear() {
    const nombres = insc || [];
    if (nombres.length < 4) { S.toast('Hacen falta al menos 4 jugadores', 'mal'); return; }
    const hay = db && db.started;
    const ok = await S.confirmar(hay
      ? { titulo: 'Empezar un torneo nuevo', texto: `El torneo actual se guarda en «Torneos anteriores» y se sortea la ronda 1 de uno nuevo con ${nombres.length} jugadores.`, ok: 'Crear', peligro: false }
      : { titulo: 'Crear el torneo', texto: `Se sorteará la ronda 1 con ${nombres.length} jugadores.`, ok: 'Crear' });
    if (!ok) return;
    S.toast('Creando el torneo…');
    try {
      const res = await S.api.enviar({ action: 'create', key: clave, players: nombres, rondas: parseInt(form.rondas, 10) || 0, nombre: form.nombre.trim() || 'Torneo de ajedrez', fecha: form.fecha });
      aplicar(res); insc = []; form.jugadores = ''; form.clase = ''; form.nombre = ''; form.rondas = ''; form.fecha = ''; aviso = null; ronda = 1; histAdmin = null;
      irA('mesas'); pintar();
      S.toast('Torneo creado', 'ok');
      if (res.warnings && res.warnings.length) S.aviso('Revisa estas mesas', '<ul>' + res.warnings.map((w) => `<li>${esc(w)}</li>`).join('') + '</ul>');
    } catch (err) { S.toast(err.message, 'mal'); }
  }

  async function enviar(cuerpo, ok) {
    try { aplicar(await S.api.enviar(Object.assign({ key: clave }, cuerpo))); if (ok) S.toast(ok, 'ok'); return true; }
    catch (err) { S.toast(err.message, 'mal'); return false; }
  }

  // ---------- Impresión ----------
  function imprimir(html) { $('#zona-imprimir').innerHTML = html; window.print(); }
  function imprimirMesas() {
    const r = ronda || db.currentRound, p = por();
    const f = db.fechas[r] ? ' · ' + S.fecha(db.fechas[r]) : '';
    const txt = { '1-0': '1 – 0', '0-1': '0 – 1', '1/2-1/2': '½ – ½', '1-0F': '1 – 0 *', '0-1F': '0 – 1 *', '0-0F': '0 – 0 *' };
    const filas = S.partidasRonda(db, r).map((m) => m.player2Id === -1
      ? `<tr><td class="c">${m.table}</td><td colspan="3">${esc(p[m.player1Id].name)} — descansa (1 punto)</td></tr>`
      : m.player2Id < 0 ? `<tr><td class="c">${m.table}</td><td colspan="3">${esc(p[m.player1Id].name)} — ausente</td></tr>`
      : `<tr><td class="c">${m.table}</td><td>${esc(p[m.player1Id].name)}</td><td class="c">${txt[m.result] || '&nbsp;'}</td><td>${esc(p[m.player2Id].name)}</td></tr>`).join('');
    imprimir(`<h1>${esc(db.nombre)}</h1><h2>Ronda ${r}${f}</h2><table><thead><tr><th class="c">Mesa</th><th>Blancas</th><th class="c">Resultado</th><th>Negras</th></tr></thead><tbody>${filas}</tbody></table>`);
  }
  function imprimirClasif() {
    const cols = S.colsDes(db);
    const filas = S.ordenados(db).map((x) => `<tr><td class="c">${x.pos}</td><td>${esc(x.name)}${x.retired ? ' (retirado)' : ''}</td><td class="c">${S.pts(x.points)}</td>${cols.map((k) => `<td class="c">${S.n1(S.valDes(x, k))}</td>`).join('')}</tr>`).join('');
    imprimir(`<h1>${esc(db.nombre)}</h1><h2>Clasificación${db.finished ? ' final' : ' tras la ronda ' + (db.currentRound - (db.roundDone ? 0 : 1))}</h2><table><thead><tr><th class="c">Puesto</th><th>Jugador</th><th class="c">Puntos</th>${cols.map((k) => `<th class="c">${S.corDes(k)}</th>`).join('')}</tr></thead><tbody>${filas}</tbody></table>`);
  }

  // ---------- Eventos ----------
  document.addEventListener('click', async (e) => {
    const nav = e.target.closest('.nav [data-tab]'); if (nav) { irA(nav.dataset.tab); return; }
    if (e.target.closest('#btn-recargar')) { if (cola.length || enCurso) S.toast('Espera, se está guardando', 'mal'); else cargar(false); return; }
    const sg = e.target.closest('[data-seg]'); if (sg) { clasifModo = sg.dataset.seg; pintar(); return; }
    const paso = e.target.closest('.paso[data-ronda]'); if (paso && !paso.disabled) { ronda = parseInt(paso.dataset.ronda, 10); pintar(); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'res') {
      const r = parseInt(a.dataset.round, 10), t = parseInt(a.dataset.table, 10), v = a.dataset.val;
      const m = db.matches.find((x) => x.round === r && x.table === t); if (!m) return;
      const nuevo = (m.result === v && guardado[r + '_' + t] !== 'error') ? '' : v;
      m.result = nuevo; encolar(r, t, nuevo); pintarMesas(); return;
    }
    if (act === 'mesa-mas') { opcionesMesa(parseInt(a.dataset.round, 10), parseInt(a.dataset.table, 10)); return; }
    if (act === 'alta') { dialogoAlta(); return; }
    if (act === 'rondas') { if (await enviar({ action: 'setRondas', rondas: parseInt(a.dataset.r, 10) })) pintar(); return; }
    if (act === 'desemp') { if (await enviar({ action: 'setDesempates', lista: a.dataset.l.split(',') }, 'Desempates cambiados')) pintar(); return; }
    if (act === 'excel') { S.descargar('torneo-' + new Date().toISOString().slice(0, 10) + '.csv', S.csv(db), 'text/csv;charset=utf-8'); return; }
    if (act === 'copia') { S.descargar('copia-torneo-' + new Date().toISOString().slice(0, 10) + '.json', S.copia(db), 'application/json'); S.toast('Copia guardada en Descargas', 'ok'); return; }
    if (act === 'restaurar') {
      const ok = await S.confirmar({ titulo: 'Restaurar una copia', texto: 'Se sustituye el torneo actual por el de la copia (el actual se guarda antes en «Torneos anteriores»).', ok: 'Elegir archivo', peligro: true, escribir: 'RESTAURAR' });
      if (ok) $('#file-restore').click();
      return;
    }
    if (act === 'jugador') { fichaJugador(parseInt(a.dataset.id, 10)); return; }
    if (act === 'generar') { dialogoGenerar(); return; }
    if (act === 'fin') { irA('clasif'); S.confeti(); return; }
    if (act === 'imprimir-mesas') { imprimirMesas(); return; }
    if (act === 'imprimir-clasif') { imprimirClasif(); return; }
    if (act === 'guardar-aviso') { if (await enviar({ action: 'setAviso', texto: $('#aviso').value }, 'Aviso guardado')) { aviso = db.aviso; } return; }
    if (act === 'menos' || act === 'mas') { if (await enviar({ action: 'setRondas', rondas: db.totalRondas + (act === 'mas' ? 1 : -1) })) pintar(); return; }
    if (act === 'deshacer') {
      const ok = await S.confirmar({ titulo: `¿Deshacer la ronda ${db.currentRound}?`, texto: 'Se borran sus mesas y resultados. Podrás generarla de nuevo.', ok: 'Deshacer', peligro: true });
      if (ok && await enviar({ action: 'undoRound' }, 'Ronda deshecha')) { ronda = db.currentRound; pintar(); }
      return;
    }
    if (act === 'crear') { crear(); return; }
    if (act === 'reabrir-insc') {
      const hayRes = db.matches.some((m) => m.round === 1 && m.player2Id > 0 && m.result);
      const ok = await S.confirmar({ titulo: 'Volver a la inscripción', texto: hayRes ? 'Ya hay resultados anotados en la ronda 1: el torneo se guarda en «Torneos anteriores» y los jugadores pasan a la lista de apuntados.' : 'Se borran las mesas de la ronda 1 y los jugadores pasan a la lista de apuntados. Podrás seguir añadiendo y sortear de nuevo.', ok: 'Volver', peligro: hayRes });
      if (!ok) return;
      try { const r = await S.api.enviar({ action: 'reopenInscripcion', key: clave }); aplicar(r); insc = r.inscritos || []; ronda = 1; histAdmin = null; irA('torneo'); pintar(); window.scrollTo(0, 0); S.toast('Ya puedes seguir apuntando', 'ok'); }
      catch (err) { S.toast(err.message, 'mal'); }
      return;
    }
    if (act === 'reintentar-insc') { insc = null; inscErr = ''; pintar(); return; }
    if (act === 'apuntar') {
      const cl = form.clase.replace(/\s+/g, '').trim();
      const nombres = form.jugadores.split('\n').map((x) => x.replace(/\s+/g, ' ').trim()).filter(Boolean).map((x) => (cl && !S.curso(x) ? x + ' ' + cl : x));
      if (!nombres.length) { S.toast('Escribe al menos un nombre', 'mal'); return; }
      try {
        const r = await S.api.enviar({ action: 'addInscritos', key: clave, nombres });
        insc = r.inscritos || []; form.jugadores = ''; form.clase = '';
        pintar(); S.toast(`${nombres.length} apuntado${nombres.length === 1 ? '' : 's'}`, 'ok');
        const f = $('#f-clase'); if (f) f.focus();
      } catch (err) { S.toast(err.message, 'mal'); }
      return;
    }
    if (act === 'quitar-insc') {
      try { const r = await S.api.enviar({ action: 'removeInscrito', key: clave, nombre: a.dataset.n }); insc = r.inscritos || []; pintar(); }
      catch (err) { S.toast(err.message, 'mal'); }
      return;
    }
    if (act === 'vaciar-insc') {
      const ok = await S.confirmar({ titulo: 'Vaciar la lista', texto: `Se quitan los ${insc.length} jugadores apuntados. No afecta a ningún torneo ya creado.`, ok: 'Vaciar', peligro: true });
      if (!ok) return;
      try { const r = await S.api.enviar({ action: 'clearInscritos', key: clave }); insc = r.inscritos || []; pintar(); S.toast('Lista vaciada', 'ok'); }
      catch (err) { S.toast(err.message, 'mal'); }
      return;
    }
    if (act === 'salir') { salir(); return; }
  });
  document.addEventListener('change', async (e) => {
    const f = e.target.dataset && e.target.dataset.fecha;
    if (f) await enviar({ action: 'setFecha', round: parseInt(f, 10), fecha: e.target.value }, 'Fecha guardada');
  });
  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (id === 'q') { busca = e.target.value; pintar(); }
    else if (id === 'f-nombre') form.nombre = e.target.value;
    else if (id === 'f-rondas') form.rondas = e.target.value;
    else if (id === 'f-fecha') form.fecha = e.target.value;
    else if (id === 'aviso') aviso = e.target.value;
    else if (id === 'f-clase') form.clase = e.target.value;
    else if (id === 'f-jug') form.jugadores = e.target.value;
  });
  setInterval(() => { if (clave && !document.hidden && tab !== 'torneo' && !cola.length && !enCurso && !generando && !S.hayVentana()) cargar(true); }, 45000);

  // ---------- Inicio ----------
  let k = '';
  try { k = localStorage.getItem('siurot_clave') || sessionStorage.getItem('siurot_clave') || ''; } catch (e) { /* */ }
  if (k) entrar(true, k);
  else setTimeout(() => $('#clave').focus(), 50);
})();
</script>
</body>
</html>
